server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routing — every unknown path serves index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API + health to the backend service on the compose network
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
  location /health {
    proxy_pass http://backend:8000;
  }
}
