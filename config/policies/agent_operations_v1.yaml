policy:
  name: agent_operations_v1
  version: "1.0"
  workflow: agent_operations
  risk_class: high

  thresholds:
    performance:
      verify: 0.40
      escalate: 0.65
    cost:
      warn_multiplier: 1.4
      stop_multiplier: 2.5
      budget_usd: 0.50
    responsibility:
      redact: 0.50
      block: 0.78

  routing:
    fast_path_below: 0.25
    verify_value_threshold: 0.42
    min_confidence_for_block: 0.68
    tight_latency_ms: 1000
    novelty_force_verify: 0.70

  human_review:
    required_for:
      - high_impact_decision
      - consequential_agent_action

  data_policy:
    sensitive_entities:
      - EMAIL_ADDRESS
      - PHONE_NUMBER
      - CREDIT_CARD
      - API_KEY
      - PERSON
      - FINANCIAL_DATA
    allowed_data_classes: [public, internal]
    forbidden_data_classes: [confidential, restricted]
    pii_action:
      confidential: block
      restricted: block
      internal: redact
      public: redact
      default: redact

  latency:
    budget_ms: 10000
